name: Build & Release ArAr Note APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Gradle Wrapper
        run: |
          ./gradlew --version

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Stage APKs for Distribution
        run: |
          mkdir -p release_assets
          echo "=== Locating Built APKs ==="
          find app/build/outputs/ -type f -name "*.apk"
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.3}"
          cp app/build/outputs/apk/release/*.apk "release_assets/ArArNote-${TAG_NAME}-release.apk"
          cp app/build/outputs/apk/release/*.apk release_assets/ArArNote-release.apk
          ls -la release_assets/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArArNote-release-apk
          path: release_assets/*release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "ArAr Note ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release_assets/*.apk
