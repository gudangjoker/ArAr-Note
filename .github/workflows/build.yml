name: Build & Release ArAr Note APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Gradle Wrapper
        run: |
          ./gradlew --version

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Stage APKs for Distribution
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/*.apk release_assets/ArArNote-v1.0.0-release.apk || true
          cp app/build/outputs/apk/debug/*.apk release_assets/ArArNote-v1.0.0-debug.apk || true
          ls -la release_assets/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArArNote-v1.0.0-release-apk
          path: release_assets/ArArNote-v1.0.0-release.apk
          if-no-files-found: warn

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArArNote-v1.0.0-debug-apk
          path: release_assets/ArArNote-v1.0.0-debug.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          name: "ArAr Note ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            release_assets/ArArNote-v1.0.0-release.apk
            release_assets/ArArNote-v1.0.0-debug.apk
